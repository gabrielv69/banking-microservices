openapi: 3.0.3
info:
  title: Account Service API
  description: Account and Movement Management
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1
    description: Account Service

paths:
  /accounts:
    get:
      summary: List all accounts
      operationId: getAllAccounts
      tags:
        - Accounts
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'

    post:
      summary: Create a new account
      operationId: createAccount
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}:
    get:
      summary: Get account by ID
      operationId: getAccountById
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update account
      operationId: updateAccount
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete account
      operationId: deleteAccount
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account deleted
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /movements:
    get:
      summary: List all movements
      operationId: getAllMovements
      tags:
        - Movements
      responses:
        '200':
          description: Movement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovementResponse'

    post:
      summary: Register a movement
      operationId: createMovement
      tags:
        - Movements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: Movement registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '400':
          description: Insufficient balance or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /movements/{movementId}:
    get:
      summary: Get movement by ID
      operationId: getMovementById
      tags:
        - Movements
      parameters:
        - name: movementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Movement found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '404':
          description: Movement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete movement
      operationId: deleteMovement
      tags:
        - Movements
      parameters:
        - name: movementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Movement deleted
        '404':
          description: Movement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/{customerId}:
    get:
      summary: Generate account statement report
      operationId: generateAccountStatement
      tags:
        - Reports
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2022-02-01"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2022-02-28"
      responses:
        '200':
          description: Report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatementResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AccountRequest:
      type: object
      required:
        - accountNumber
        - accountType
        - initialBalance
        - customerId
      properties:
        accountNumber:
          type: string
          example: "478758"
          pattern: '^\d{6}$'
        accountType:
          type: string
          enum: [SAVINGS, CHECKING]
          example: "SAVINGS"
        initialBalance:
          type: number
          format: decimal
          example: 2000.00
          minimum: 0
        status:
          type: boolean
          default: true
        customerId:
          type: integer
          format: int64
          example: 1

    AccountResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        accountNumber:
          type: string
          example: "478758"
        accountType:
          type: string
          example: "SAVINGS"
        currentBalance:
          type: number
          format: decimal
          example: 2000.00
        status:
          type: boolean
          example: true
        customerId:
          type: integer
          format: int64
          example: 1

    MovementRequest:
      type: object
      required:
        - accountId
        - movementType
        - value
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        movementType:
          type: string
          enum: [CREDIT, DEBIT]
          example: "DEBIT"
        value:
          type: number
          format: decimal
          example: 575.00
          minimum: 0.01

    MovementResponse:
      type: object
      properties:
        movementId:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date-time
          example: "2022-02-10T14:30:00Z"
        movementType:
          type: string
          example: "DEBIT"
        value:
          type: number
          format: decimal
          example: 575.00
        balance:
          type: number
          format: decimal
          example: 1425.00
        accountId:
          type: integer
          format: int64
          example: 1

    AccountStatementResponse:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
          example: 1
        customerName:
          type: string
          example: "Jose Lema"
        startDate:
          type: string
          format: date
          example: "2022-02-01"
        endDate:
          type: string
          format: date
          example: "2022-02-28"
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountStatementDetail'

    AccountStatementDetail:
      type: object
      properties:
        accountNumber:
          type: string
          example: "478758"
        accountType:
          type: string
          example: "SAVINGS"
        currentBalance:
          type: number
          format: decimal
          example: 1425.00
        movements:
          type: array
          items:
            $ref: '#/components/schemas/MovementResponse'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2024-02-14T10:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Insufficient balance"
        path:
          type: string
          example: "/api/v1/movements"

    CustomerResponse:
      type: object
      description: Customer data from customer-service (for display only)
      properties:
        customerId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Jose Lema"
        identification:
          type: string
          example: "1234567890"
        gender:
          type: string
          example: "MALE"
        address:
          type: string
          example: "Otavalo sn y principal"
        phone:
          type: string
          example: "098254785"
        status:
          type: boolean
          example: true