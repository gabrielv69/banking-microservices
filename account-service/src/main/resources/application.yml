server:
  port: 8082

spring:
  application:
    name: account-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/account_db
    username: postgres
    password: postgres

  sql:
    init:
      mode: never

# Configuracion para comunicarse con customer-service
customer-service:
  base-url: http://localhost:8081/api/v1

logging:
  level:
    root: INFO
    com.banking.customer: DEBUG
    org.springframework.r2dbc: DEBUG