plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.15.0'
}

group = 'com.banking'
version = '0.0.1-SNAPSHOT'
description = 'Account Management Microservice'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.15'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.8'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.41'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.named('test') {
	useJUnitPlatform()
}


// Configuracion de OpenAPI Generator
openApiGenerate {
    generatorName = "spring"
    inputSpec = "${projectDir}/account-api.yaml"
    outputDir = "$buildDir/generated".toString()
    apiPackage = "com.banking.account.infrastructure.adapter.rest.generated"
    modelPackage = "com.banking.account.infrastructure.adapter.rest.generated.model"
    configOptions = [
            reactive: "true",
            interfaceOnly: "true",
            skipDefaultInterface: "true",
            useTags: "true",
            useSpringBoot3: "true",
            useBigDecimal: "true"
    ]
    typeMappings = [
            decimal: "java.math.BigDecimal"  // ← Mapea decimal a BigDecimal
    ]
}

// Agregar código generado al sourceSets
sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

// Asegurar que la generación ocurra antes de compilar
compileJava.dependsOn tasks.openApiGenerate